<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raport podatności Nessus</title>
<style>body{font:15px system-ui;background:#f3f5fa;color:#18233a;margin:0}main{max-width:1300px;margin:auto;padding:32px}h1{margin-bottom:8px}header,p{color:#526078}section,.bar{background:white;padding:20px;border-radius:12px;margin:16px 0}input,select,button{font:inherit;padding:10px;border:1px solid #ccd3e0;border-radius:6px}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid #e1e5ee}td{white-space:pre-wrap;overflow-wrap:anywhere}th{color:#526078}details{background:white;border-radius:10px;margin:12px 0;padding:16px}summary{cursor:pointer;font-weight:650}.scroll{overflow:auto}.bar{display:flex;gap:12px;flex-wrap:wrap}#status{white-space:pre-wrap}small{color:#637089}@media print{.bar,#intro{display:none}body{background:white}main{padding:0}details{break-inside:avoid}table{font-size:11px}}</style>
<main><h1>Raport podatności</h1><p id="intro">Wczytaj CSV z Nessusa. Dane są przetwarzane w tej przeglądarce. Plik nie jest wysyłany na serwer.</p>
<div class="bar"><input id="file" type="file" accept=".csv,text/csv"><select id="encoding"><option value="utf-8">UTF-8</option><option value="windows-1250">Windows-1250</option></select><input id="search" placeholder="Szukaj hosta, IP, podatności lub rozwiązania" size="42"><select id="view"><option value="host">Według hostów</option><option value="vuln">Według podatności</option></select><button id="print">Drukuj / zapisz PDF</button></div><p id="status">Wybierz plik CSV.</p><div id="report"></div></main>
<script>
const $=id=>document.getElementById(id);let rows=[];
const fields=['Nazwa hosta','IP','Nazwa podatności','Rozwiązanie'];
function parse(text,sep){let out=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else if(quoted||cell==='')quoted=!quoted;else cell+=c}else if(c===sep&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('Niedomknięty cudzysłów w CSV.');row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function read(){const file=$('file').files[0];if(!file)return;try{const text=new TextDecoder($('encoding').value).decode(await file.arrayBuffer()).replace(/^\uFEFF/,'');let candidates=[',',';','\t'].map(s=>parse(text,s));let data=candidates.find(d=>d.length&&fields.every(f=>d[0].map(x=>x.trim()).includes(f)));if(!data)throw Error('Brakuje wymaganych kolumn: '+fields.join(', ')+'. Sprawdź kodowanie.');const headers=data.shift().map(x=>x.trim());if(new Set(headers).size!==headers.length)throw Error('Nagłówki kolumn nie mogą się powtarzać.');const bad=data.findIndex(r=>r.length!==headers.length);if(bad>=0)throw Error('Nieprawidłowa liczba kolumn w rekordzie '+(bad+2)+'.');rows=data.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i].trim()])));render()}catch(e){rows=[];$('report').replaceChildren();$('status').textContent=e.message}}
function render(){const q=$('search').value.toLocaleLowerCase('pl');const filtered=rows.filter(r=>Object.values(r).join(' ').toLocaleLowerCase('pl').includes(q));const hosts=new Set(filtered.map(r=>JSON.stringify([r['Nazwa hosta'],r.IP])));const vulns=new Set(filtered.map(r=>r['Nazwa podatności']));$('status').textContent=`Widoczne: ${filtered.length} wykryć • ${hosts.size} hostów • ${vulns.size} nazw podatności. Wczytano: ${rows.length} rekordów.\nKażdy wiersz CSV jest osobnym wykryciem; poziomy ważności są pokazane zgodnie z plikiem.`;const groups=new Map();const byHost=$('view').value==='host';for(const r of filtered){const key=byHost?JSON.stringify([r['Nazwa hosta'],r.IP]):r['Nazwa podatności'];if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}$('report').replaceChildren();for(const [key,items] of [...groups].sort((a,b)=>a[0].localeCompare(b[0],'pl'))){const d=document.createElement('details');d.open=true;const title=byHost?`${items[0]['Nazwa hosta']||'Bez nazwy'} — ${items[0].IP||'Brak IP'}`:key||'Brak nazwy podatności';d.append(node('summary',`${title} (${items.length} wykryć)`));const wrap=node('div','');wrap.className='scroll';const table=document.createElement('table');const cols=byHost?['Nazwa podatności','Ważność ORGANIZACJA','Ważność CVSS V3','Ważność CVSS V2','VPR','Rozwiązanie']:['Nazwa hosta','IP','Ważność ORGANIZACJA','Ważność CVSS V3','VPR','Rozwiązanie'];const head=document.createElement('thead'),hr=document.createElement('tr');cols.forEach(c=>hr.append(node('th',c)));hr.append(node('th','Szczegóły'));head.append(hr);table.append(head);const body=document.createElement('tbody');for(const r of items){const tr=document.createElement('tr');cols.forEach(c=>tr.append(node('td',r[c]||(c==='Rozwiązanie'?'Brak zalecenia w CSV':'—'))));const td=document.createElement('td'),extra=document.createElement('details');extra.append(node('summary','Pokaż'));for(const [name,value] of Object.entries(r)){if(!cols.includes(name))extra.append(node('p',`${name}: ${value||'—'}`))}td.append(extra);tr.append(td);body.append(tr)}table.append(body);wrap.append(table);d.append(wrap);$('report').append(d)}}
$('file').addEventListener('change',read);$('encoding').addEventListener('change',read);$('search').addEventListener('input',render);$('view').addEventListener('change',render);$('print').addEventListener('click',()=>window.print());
</script></html>
